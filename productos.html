<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtrado de Productos</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
     <h1>Catálogo de Productos</h1>

    <section id="filtros">
        <input type="text" id="buscador" placeholder="Buscar por nombre...">
        
        <select id="filtroCategoria">
            <option value="todos">Todas las categorías</option>
            <option value="accesorios">Accesorios</option>
            <option value="electronicos">Electrónicos</option>
            <option value="articulos escolares">Artículos Escolares</option>
        </select>

        <label>
            Precio máx: $<span id="precioValor">100000</span>
            <input type="range" id="filtroPrecio" min="0" max="100000" step="5000" value="100000">
        </label>

        <label>
            <input type="checkbox" id="filtroStock"> Solo en stock
        </label>
    </section>

    <div id="contenedorProductos" class="grid-productos"></div>

    <script src="productos.js"></script>
    
    <script>
        document.getElementById('filtroPrecio').addEventListener('input', (e) => {
            document.getElementById('precioValor').textContent = e.target.value;
        });
    </script>
</body>
</html>
